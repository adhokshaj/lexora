<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203b34"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><title>Lexora</title><style>
:root{color-scheme:light dark;--bg:#f5f4ec;--card:#fffefa;--ink:#203b34;--muted:#64736b;--line:#dce0d5;--accent:#dcebd5}*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:650px;margin:auto;padding:24px 20px 110px}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}header img{width:48px;border-radius:13px}header b{font-size:25px;letter-spacing:-1px}small,.muted{color:var(--muted)}h1{font-size:32px;letter-spacing:-1.2px;margin:8px 0 16px}h2{font-size:19px;margin:22px 0 12px}h3{margin:0 0 10px}p{line-height:1.5}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:13px 16px;background:var(--ink);color:var(--bg);font-weight:600}button.secondary{background:var(--accent);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin:6px 0}.card{padding:20px;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:12px 0}.hero{background:#203b34;color:#fffefa;padding:24px}.hero small{color:#b7cabb}.hero button{background:#dcebd5;color:#203b34}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{margin:0;cursor:pointer}.item{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:4px 0;display:flex;justify-content:space-between;align-items:center}.item small{font-weight:400}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:2}nav button{background:none;color:var(--muted);font-size:11px;min-width:58px;flex:1;max-width:130px;padding:8px 3px}nav button.active{color:var(--ink);background:var(--accent)}nav span{display:block;font-size:20px}.flash{min-height:245px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}.flash h1{font-size:38px}.pill{display:inline-block;border-radius:20px;background:var(--accent);padding:5px 10px;font-size:12px}.progress{height:7px;background:var(--line);border-radius:10px;overflow:hidden}.progress div{height:100%;background:#82a884}.notice{font-size:13px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#14221f;--card:#1d302b;--ink:#e7eee0;--muted:#aab9ae;--line:#354941;--accent:#344d41}.hero{background:#304c40}}
</style></head><body><main><header><img src="icon-192.png" alt="Lexora logo"><div><b>lexora.</b><br><small>Make words yours.</small></div></header><div id="app"></div></main><nav id="nav"></nav><script src="data.js"></script><script src="app.js"></script></body></html>
