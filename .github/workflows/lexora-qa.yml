name: Lexora QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lexora-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            runner: ubuntu-24.04
          - browser: webkit
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/verify-release.sh
      - run: pip install playwright==1.65.2
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - if: runner.os == 'macOS'
        run: python -m playwright install ${{ matrix.browser }}
      - run: python qa/e2e.py . --browser ${{ matrix.browser }}
