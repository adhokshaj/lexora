name: Lexora QA
on:
  pull_request:
    branches: [main]
  push:
    branches: ['qa/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node worker/test.mjs
      - run: for f in app.js online.js quality.js sw.js; do node --check "$f"; done
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python qa/e2e.py . --browser ${{ matrix.browser }}
